services:
  - type: web
    name: ftm-coder-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render auto-assigns PORT — we pass it through
    envVars:
      - key: NODE_ENV
        value: production
      - key: STATIC_DIR
        value: /app/public
      # Add DATABASE_URL here if needed:
      # - key: DATABASE_URL
