services:
  app:
    build: .
    ports:
      - "3000:3000"       # FTM-CODER-AI web + API
      - "11434:11434"     # Ollama API (optional — expose if you want direct access)
    environment:
      NODE_ENV: production
      PORT: 3000
      STATIC_DIR: /app/public
      # Ollama runs inside the same container — auto-configured
      AI_BASE_URL: http://localhost:11434/v1
      # Best local coding model — fast, accurate, 4.7 GB on disk.
      # Needs ~6-8 GB RAM. Override to any Ollama model name.
      AI_MODEL: qwen2.5-coder:7b
      # Optional: swap to a cloud provider instead of Ollama
      # AI_BASE_URL: https://api.z.ai/v1
      # AI_API_KEY: your_z_ai_key
      # AI_MODEL: glm-5.2
    volumes:
      # Persist downloaded models across container restarts
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # Give it extra time to start (Ollama + model pull on first run)
    stop_grace_period: 30s

volumes:
  ollama_models:
    driver: local
