name: Auto Release + Build Executables

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: "auto"
        type: choice
        options: [auto, patch, minor, major]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Decide next version from commit messages (semver auto-bump)
  # ─────────────────────────────────────────────────────────────
  version:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
      changelog: ${{ steps.bump.outputs.changelog }}
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version & changelog
        id: bump
        shell: bash
        run: |
          # Get the latest semver tag (default v0.0.0 if none)
          LATEST=$(git tag --list 'v*.*.*' --sort=-version:refname | head -n1)
          LATEST=${LATEST:-v0.0.0}
          echo "Latest tag: $LATEST"

          MAJOR=$(echo $LATEST | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo $LATEST | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo $LATEST | sed 's/v//' | cut -d. -f3)

          # Determine bump type from commit messages since last tag
          COMMITS=$(git log ${LATEST}..HEAD --oneline 2>/dev/null || git log --oneline)

          INPUT_BUMP="${{ github.event.inputs.bump }}"

          if [ "$INPUT_BUMP" = "major" ]; then
            BUMP=major
          elif [ "$INPUT_BUMP" = "minor" ]; then
            BUMP=minor
          elif [ "$INPUT_BUMP" = "patch" ]; then
            BUMP=patch
          else
            # Auto-detect from conventional commits
            if echo "$COMMITS" | grep -qiE "BREAKING[[:space:]]CHANGE|!:"; then
              BUMP=major
            elif echo "$COMMITS" | grep -qiE "^[a-f0-9]+ feat(\(.+\))?:"; then
              BUMP=minor
            else
              BUMP=patch
            fi
          fi

          echo "Bump type: $BUMP"

          case $BUMP in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_TAG="v$NEW_VERSION"

          # Build changelog from commits
          CHANGELOG=$(git log ${LATEST}..HEAD --pretty=format:"- %s (%h)" 2>/dev/null | head -30 || echo "- Initial release")
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No new commits"
          fi

          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Multiline output
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "Next version: $NEW_TAG"

  # ─────────────────────────────────────────────────────────────
  # 2. Build frontend + API server, then compile executables
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build & package executables
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: win
            target: node20-win-x64
            ext: .exe
            archive: zip
          - os: linux
            target: node20-linux-x64
            ext: ""
            archive: tar
          - os: macos
            target: node20-macos-x64
            ext: ""
            archive: tar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/ftm-coder-ai run build

      - name: Build API server (ESM, for production)
        run: pnpm --filter @workspace/api-server run build

      - name: Build CJS bundle (for pkg packaging)
        run: node artifacts/api-server/pkg-build.mjs

      - name: Install pkg globally
        run: npm install -g @yao-pkg/pkg

      - name: Compile executable — ${{ matrix.os }}
        run: |
          pkg artifacts/api-server/dist-pkg/index.cjs \
            --target ${{ matrix.target }} \
            --output ftm-coder-ai-${{ matrix.os }}${{ matrix.ext }} \
            --no-bytecode \
            --public \
            --public-packages "*"

      - name: Copy frontend into release bundle
        run: |
          mkdir -p release-bundle/public
          cp -r artifacts/ftm-coder-ai/dist/. release-bundle/public/
          cp ftm-coder-ai-${{ matrix.os }}${{ matrix.ext }} release-bundle/

          # Write a quick-start README into the bundle
          cat <<'README' > release-bundle/README.txt
          FTM-CODER-AI — Quick Start
          ===========================
          1. Run the executable:
               Windows : ftm-coder-ai.exe
               Linux   : ./ftm-coder-ai-linux
               macOS   : ./ftm-coder-ai-macos

          2. Open http://localhost:3000 in your browser.

          Environment variables (optional):
            PORT=3000
            AI_BASE_URL=http://localhost:11434/v1
            AI_MODEL=glm4
          README

      - name: Create archive (zip — Windows)
        if: matrix.archive == 'zip'
        run: |
          cd release-bundle
          zip -r ../ftm-coder-ai-${{ matrix.os }}-${{ needs.version.outputs.version }}.zip .

      - name: Create archive (tar.gz — Linux/macOS)
        if: matrix.archive == 'tar'
        run: |
          chmod +x release-bundle/ftm-coder-ai-${{ matrix.os }}${{ matrix.ext }}
          tar -czf ftm-coder-ai-${{ matrix.os }}-${{ needs.version.outputs.version }}.tar.gz -C release-bundle .

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            ftm-coder-ai-${{ matrix.os }}-${{ needs.version.outputs.version }}.zip
            ftm-coder-ai-${{ matrix.os }}-${{ needs.version.outputs.version }}.tar.gz
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # 3. Tag the commit + publish GitHub Release with all binaries
  # ─────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: ./release-assets

      - name: List assets
        run: ls -lh ./release-assets/

      - name: Create Git tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.version.outputs.tag }} -m "Release ${{ needs.version.outputs.tag }}"
          git push origin ${{ needs.version.outputs.tag }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "FTM-CODER-AI ${{ needs.version.outputs.tag }}"
          body: |
            ## What's Changed
            ${{ needs.version.outputs.changelog }}

            ---
            ### Downloads
            | Platform | File |
            |----------|------|
            | 🪟 Windows (x64) | `ftm-coder-ai-win-${{ needs.version.outputs.version }}.zip` |
            | 🐧 Linux (x64)   | `ftm-coder-ai-linux-${{ needs.version.outputs.version }}.tar.gz` |
            | 🍎 macOS (x64)   | `ftm-coder-ai-macos-${{ needs.version.outputs.version }}.tar.gz` |

            > Each archive contains the executable **+** the frontend `public/` folder and a README.
          files: ./release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
