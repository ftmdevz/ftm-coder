openapi: 3.0.3
info:
  title: FTM Coder AI API
  version: 1.0.0
  description: Backend API for FTM-CODER-AI IDE Agent

servers:
  - url: /api

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /files:
    get:
      operationId: listFiles
      summary: List files in a directory
      parameters:
        - name: path
          in: query
          required: false
          schema:
            type: string
          description: Directory path relative to workspace root
        - name: workspace
          in: query
          required: false
          schema:
            type: string
          description: Workspace root path
      responses:
        "200":
          description: File tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileTreeResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /files/content:
    get:
      operationId: readFile
      summary: Read file content
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: workspace
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: File content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContentResponse"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: writeFile
      summary: Write/save file content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteFileRequest"
      responses:
        "200":
          description: File saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /git/status:
    get:
      operationId: getGitStatus
      summary: Get git status for workspace
      parameters:
        - name: workspace
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Git status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitStatusResponse"

  /git/diff:
    get:
      operationId: getGitDiff
      summary: Get git diff
      parameters:
        - name: workspace
          in: query
          required: false
          schema:
            type: string
        - name: file
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Git diff output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitDiffResponse"

  /git/commit:
    post:
      operationId: gitCommit
      summary: Stage all and commit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitCommitRequest"
      responses:
        "200":
          description: Commit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat/message:
    post:
      operationId: sendChatMessage
      summary: Send a message to the AI coding agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageRequest"
      responses:
        "200":
          description: AI response with optional tool calls and plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessageResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat/apply:
    post:
      operationId: applyChanges
      summary: Apply pending file changes from AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyChangesRequest"
      responses:
        "200":
          description: Changes applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyResult"

  /git/push:
    post:
      operationId: gitPush
      summary: Set remote and push to GitHub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitPushRequest"
      responses:
        "200":
          description: Push result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Push failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workspace/open:
    post:
      operationId: openWorkspace
      summary: Set the current workspace root path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenWorkspaceRequest"
      responses:
        "200":
          description: Workspace opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string

    FileNode:
      type: object
      required: [name, path, type]
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [file, directory]
        children:
          type: array
          items:
            $ref: "#/components/schemas/FileNode"
        size:
          type: integer
        extension:
          type: string

    FileTreeResponse:
      type: object
      required: [files, workspace]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileNode"
        workspace:
          type: string

    FileContentResponse:
      type: object
      required: [content, path]
      properties:
        content:
          type: string
        path:
          type: string
        language:
          type: string
        size:
          type: integer
        lines:
          type: integer

    WriteFileRequest:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string
        workspace:
          type: string

    GitStatusResponse:
      type: object
      required: [files, isClean]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/GitFileStatus"
        isClean:
          type: boolean
        branch:
          type: string
        ahead:
          type: integer
        behind:
          type: integer

    GitFileStatus:
      type: object
      required: [path, status]
      properties:
        path:
          type: string
        status:
          type: string
        staged:
          type: boolean

    GitDiffResponse:
      type: object
      required: [diff]
      properties:
        diff:
          type: string
        files:
          type: array
          items:
            type: string

    GitCommitRequest:
      type: object
      required: [message, workspace]
      properties:
        message:
          type: string
        workspace:
          type: string

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string

    ChatMessageRequest:
      type: object
      required: [message, workspace]
      properties:
        message:
          type: string
        workspace:
          type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        activeFile:
          type: string

    PendingChange:
      type: object
      required: [path, content, type]
      properties:
        path:
          type: string
        content:
          type: string
        originalContent:
          type: string
        type:
          type: string
          enum: [create, modify, delete]
        diff:
          type: string

    ChatMessageResponse:
      type: object
      required: [message, toolCallsUsed]
      properties:
        message:
          type: string
        plan:
          type: string
        pendingChanges:
          type: array
          items:
            $ref: "#/components/schemas/PendingChange"
        toolCallsUsed:
          type: integer
        commandsRun:
          type: array
          items:
            type: string

    ApplyChangesRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/PendingChange"
        workspace:
          type: string

    ApplyResult:
      type: object
      required: [applied]
      properties:
        applied:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string

    GitPushRequest:
      type: object
      required: [workspace, repoUrl, token]
      properties:
        workspace:
          type: string
        repoUrl:
          type: string
          description: "GitHub repo URL e.g. https://github.com/user/repo"
        token:
          type: string
          description: "GitHub Personal Access Token"
        branch:
          type: string
          description: "Branch to push (default: main)"

    OpenWorkspaceRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string

    WorkspaceResponse:
      type: object
      required: [path, name]
      properties:
        path:
          type: string
        name:
          type: string
        hasGit:
          type: boolean
        hasPackageJson:
          type: boolean
